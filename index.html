<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>App Closed</title>
  <script>
    // 1. Saare service workers ko unregister karega
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let reg of registrations) {
          reg.unregister();
        }
      });
    }
    // 2. Phone ka offline cache delete karega
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
    // 3. Storage clear
    localStorage.clear();
    sessionStorage.clear();
  </script>
</head>
<body style="background:#000; color:#fff; text-align:center; padding-top:100px; font-family:sans-serif;">
  <h1>⚠️ Yeh App Permanently Band Ho Chuka Hai</h1>
</body>
</html>
